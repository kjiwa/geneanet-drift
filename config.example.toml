# Copy to <data dir>/config.toml. GRAMPS_URL, GRAMPS_USER and GRAMPS_WRITE_USER override the keys below.
# Passwords are never read from here: set GRAMPS_PASSWORD and GRAMPS_WRITE_PASSWORD in the
# environment or <data dir>/.env, or leave them unset to be prompted.

# The slug in the Geneanet tree URL, without the trailing _w.
tree = "example"
gramps_url = "https://gramps.example.org"
gramps_user = "drift-reader"
# Only `apply` and `undo` write, and only as this Editor user (GRAMPS_WRITE_PASSWORD).
gramps_write_user = "drift-editor"

# Surnames on the line you share with the tree owner; their clusters sort first.
priority_surnames = ["Quillon"]
