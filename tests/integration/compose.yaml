# Throwaway Gramps Web for integration tests; synthetic data only.
# Users (created by seed.py): it-admin / it-admin-pw (Owner), it-editor / it-editor-pw (Editor),
# it-reader / it-reader-pw (Member).
name: geneanet-drift-it

x-grampsweb: &grampsweb
  image: ghcr.io/gramps-project/grampsweb:26.11.0
  environment:
    GRAMPSWEB_TREE: Integration
    GRAMPSWEB_SECRET_KEY: integration-only-not-a-secret
    GRAMPSWEB_CELERY_CONFIG__broker_url: redis://redis:6379/0
    GRAMPSWEB_CELERY_CONFIG__result_backend: redis://redis:6379/0
    GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://redis:6379/1
  volumes:
    - users:/app/users
    - index:/app/indexdir
    - thumbnail_cache:/app/thumbnail_cache
    - cache:/app/cache
    - secret:/app/secret
    - db:/root/.gramps/grampsdb
    - media:/app/media
    - tmp:/tmp

services:
  grampsweb:
    <<: *grampsweb
    ports:
      - "127.0.0.1:18080:5000"
    depends_on:
      - redis
  grampsweb_celery:
    <<: *grampsweb
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=1
    depends_on:
      - redis
  redis:
    image: docker.io/library/redis:7-alpine

volumes:
  users:
  index:
  thumbnail_cache:
  cache:
  secret:
  db:
  media:
  tmp:
