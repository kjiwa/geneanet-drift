[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geneanet-drift"
version = "0.1.0"
description = "Fold edits captured from a Geneanet tree into a Gramps Web tree, with review and undo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
geneanet-drift = "geneanet_drift.wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geneanet_drift = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# The change log shows wall-clock times with no zone; they are only compared to each other.
extend-ignore = ["DTZ001", "DTZ007"]
