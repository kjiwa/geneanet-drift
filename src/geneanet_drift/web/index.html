<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="review-token" content="__REVIEW_TOKEN__">
<title>Review changes</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="review">
  <header class="bar">
    <p class="brand">geneanet-drift</p>
    <div class="bar-tools">
      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <button id="apply" class="button" type="button" data-variant="primary" aria-haspopup="dialog">Accepted changes (0)</button>
    </div>
  </header>
  <p id="flash" class="status" data-kind="error" role="alert" hidden></p>
  <p id="notice" class="status" role="status" hidden></p>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="plan" aria-labelledby="plan-title">
  <h2 id="plan-title">Accepted changes</h2>
  <div id="plan-body"></div>
  <div class="actions">
    <button id="plan-close" class="button" type="button">Close</button>
  </div>
</dialog>
<noscript><p class="status">This page needs JavaScript to show the review.</p></noscript>
</body>
</html>
